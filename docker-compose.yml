# Karivex — chemical division
# Lessons from your alias-collision debugging baked in:
#  - dedicated project network (karivex_net), NOT a shared external network
#  - explicit unique container_name for every service
#  - nginx upstream + inter-service URLs use container names, never generic
#    aliases like `backend`/`frontend`
# Deploy: docker compose build && docker compose up -d --force-recreate
# (two steps, never `up --build` during a crash-loop)
#
# This server fronts multiple sites behind one shared nginx container
# (finstar-chemicals-nginx, owns host ports 80/443). This stack does NOT run
# its own nginx (karivex_nginx below is unused/not started) — instead
# karivex_backend/karivex_frontend join the shared finstar-network so the
# central nginx can reach them by container name, same pattern as kykam.
name: karivex

services:
  karivex_db:
    image: postgres:16-alpine
    container_name: karivex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karivex}
      POSTGRES_USER: ${POSTGRES_USER:-karivex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - karivex_pgdata:/var/lib/postgresql/data
    networks: [karivex_net]

  karivex-backend:
    build: ./backend
    # Hyphen, not underscore: Django's get_host() splits the HTTP Host header
    # with an RFC-1034/1035 hostname regex that rejects underscores outright
    # (DisallowedHost) before ALLOWED_HOSTS is even consulted — so any
    # server-side fetch that bypasses nginx and hits this container by name
    # directly (frontend's INTERNAL_API_URL calls) 400s no matter what's in
    # ALLOWED_HOSTS. nginx itself was never affected since it always sends
    # the real public domain via proxy_set_header Host $host.
    container_name: karivex-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: karivex_db
      FRONTEND_INTERNAL_URL: http://karivex_frontend:3000
    depends_on: [karivex_db]
    volumes:
      - karivex_media:/app/media
    networks: [karivex_net, finstar-network]

  karivex_frontend:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL}
        SITE_NAME: ${SITE_NAME}
        SITE_SHORT_NAME: ${SITE_SHORT_NAME}
        SITE_TAGLINE: ${SITE_TAGLINE}
        SITE_LEGAL_NAME: ${SITE_LEGAL_NAME}
        SITE_BRAND_URL: ${SITE_BRAND_URL}
        SITE_ALTERNATE_NAMES: ${SITE_ALTERNATE_NAMES}
        SITE_DESCRIPTION: ${SITE_DESCRIPTION}
        SITE_SAME_AS: ${SITE_SAME_AS}
        SITE_PHONE: ${SITE_PHONE}
        SITE_PHONE_ALT: ${SITE_PHONE_ALT}
        SITE_WHATSAPP: ${SITE_WHATSAPP}
        SITE_EMAIL: ${SITE_EMAIL}
        SITE_ADDRESS_STREET: ${SITE_ADDRESS_STREET}
        SITE_ADDRESS_LOCALITY: ${SITE_ADDRESS_LOCALITY}
        SITE_ADDRESS_REGION: ${SITE_ADDRESS_REGION}
        SITE_ADDRESS_POSTAL_CODE: ${SITE_ADDRESS_POSTAL_CODE}
        SITE_ADDRESS_COUNTRY: ${SITE_ADDRESS_COUNTRY}
        SITE_REGIONS: ${SITE_REGIONS}
        SITE_HOURS: ${SITE_HOURS}
        SITE_DELIVERY_NAIROBI: ${SITE_DELIVERY_NAIROBI}
        SITE_DELIVERY_REGIONAL: ${SITE_DELIVERY_REGIONAL}
        SITE_CERTIFICATIONS: ${SITE_CERTIFICATIONS}
    container_name: karivex_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      INTERNAL_API_URL: http://karivex-backend:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set in .env}
      # Docker auto-sets HOSTNAME to the container ID; Next's standalone
      # server.js does `process.env.HOSTNAME || '0.0.0.0'`, so without this
      # override it binds to whichever single network that ID happens to
      # resolve on (order is unstable across recreates) instead of all
      # interfaces — causing 502s from the other network's nginx.
      HOSTNAME: "0.0.0.0"
    depends_on: [karivex-backend]
    networks: [karivex_net, finstar-network]

  # karivex_nginx: intentionally not started — the shared finstar-chemicals-nginx
  # container handles routing for this host (see nginx/karivex.conf for the
  # location rules it was translated into on the shared nginx side).
  karivex_nginx:
    image: nginx:alpine
    container_name: karivex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/karivex.conf:/etc/nginx/conf.d/default.conf:ro
      - karivex_media:/media:ro
      # - certbot volumes here once TLS is issued
    depends_on: [karivex_frontend, karivex-backend]
    networks: [karivex_net]
    profiles: ["standalone-nginx"]

networks:
  karivex_net:
    name: karivex_net
  finstar-network:
    external: true
    name: finstar-industrial-chemicals_finstar-network

volumes:
  karivex_pgdata:
  karivex_media:
