# Upstreams by unique container name — immune to alias collisions even if this
# stack ever joins a shared network later.
upstream karivex_next { server karivex_frontend:3000; }
upstream karivex_api  { server karivex_backend:8000; }

server {
    listen 80;
    server_name karivex.co.ke www.karivex.co.ke;

    gzip on;
    gzip_types text/html text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://karivex_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /admin/ {
        proxy_pass http://karivex_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /_next/static/ {
        proxy_pass http://karivex_next;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://karivex_next;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
