# Upstreams by unique container name — immune to alias collisions even if this
# stack ever joins a shared network later.
upstream karivex_next { server karivex_frontend:3000; }
upstream karivex_api  { server karivex-backend:8000; }

# www.industrialchemicals.karivexsolutionsltd.com is 44 characters; the default
# 64-byte hash bucket cannot hold the Karivex hostname set and nginx refuses to
# start ("could not build server_names_hash"). http-context directive, valid
# here because conf.d/*.conf is included inside http {}.
server_names_hash_bucket_size 128;

# karivexsolutionsltd.com is the canonical host. Everything else 301s to it.
#
# History worth keeping: this server also hosts Finstar Industrial Chemicals
# and Kykam, unrelated companies sharing one nginx. karivexsolutionsltd.com
# previously matched NO server_name anywhere, so nginx fell back to the default
# server for the port — the first block in the shared config, finstar's — and
# every request for the Karivex brand domain was 301'd to
# finstarindustrialchemicals.com, with HTTPS offering finstar's certificate.
# That is why brand-name searches resolved to another company. Naming every
# Karivex hostname explicitly is what keeps the sites independent.
#
# www, and the former catalogue subdomain, both redirect here. The subdomain is
# still in Google's index, so its 301 is the site-move signal that transfers
# accumulated ranking to the brand domain — keep it for as long as inbound
# links to the subdomain exist; deleting it turns every one of them into a 404.
server {
    listen 80;
    server_name www.karivexsolutionsltd.com
                industrialchemicals.karivexsolutionsltd.com
                www.industrialchemicals.karivexsolutionsltd.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://karivexsolutionsltd.com$request_uri; }
}

server {
    listen 80;
    # Must match SITE_URL in .env — this is the canonical host, the one every
    # canonical tag, the sitemap and metadataBase point at.
    server_name karivexsolutionsltd.com;

    gzip on;
    gzip_types text/html text/css application/json application/javascript image/svg+xml;

    # Next-owned branches of /api/, which must NOT go to Django. Longest ^~
    # prefix wins, so these beat the /api/ rule below regardless of order.
    # /api/proxy/* is what every browser-side form post uses (QuoteForm ->
    # /api/proxy/quotes/, ChatWidget -> /api/proxy/ai/chat/). Rewritten
    # straight to Django here rather than proxied through Next: going via Next
    # costs two redirects (Next drops the trailing slash, Django's APPEND_SLASH
    # puts it back) and a 301 silently discards the POST body.
    location ^~ /api/proxy/ {
        rewrite ^/api/proxy/(.*)$ /api/$1 break;
        proxy_pass http://karivex_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/revalidate {
        proxy_pass http://karivex_next;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://karivex_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Django's own admin.site.urls, distinct from the Next.js /admin control
    # center below — see backend/karivex/urls.py.
    location /django-admin/ {
        proxy_pass http://karivex_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /_next/static/ {
        proxy_pass http://karivex_next;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://karivex_next;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
